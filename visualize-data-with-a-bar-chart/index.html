<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>United States GDP - Bar Chart</title>

  <!-- CSS -->
  <link rel="stylesheet" href="./style.css">

  <!-- D3.js -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>

  <!-- JavaScript -->
  <script src="./script.js" defer></script>
</head>

<body>

  <div class="dashboard">

    <header class="dashboard-header">

      <span class="badge">DATA VISUALIZATION</span>

      <h1 id="title">United States GDP</h1>

      <p class="subtitle">
        Historical Gross Domestic Product · 1947–2015
      </p>

    </header>

    <div class="chart-container">

      <div id="chart"></div>

      <div id="tooltip"></div>

    </div>

    <footer class="dashboard-footer">

      <span>Source: U.S. Bureau of Economic Analysis</span>

      <span>Built with D3.js</span>

    </footer>

  </div>

  <!-- ========================================
       FREECODECAMP TEST SUITE
  ========================================= -->

  <script src="https://cdn.freecodecamp.org/testable-projects-fcc/v1/bundle.js"></script>

</body>

</html>
