<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Global Temperature - Heat Map</title>

  <link rel="stylesheet" href="./style.css?v=3">

  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>

  <script src="./script.js?v=3" defer></script>
</head>

<body>

  <main class="dashboard">

    <header class="dashboard-header">
      <span class="badge">DATA VISUALIZATION</span>

      <h1 id="title">Global Land-Surface Temperature</h1>

      <p id="description" class="subtitle">
        Monthly Temperature Variations · 1753–2015
      </p>
    </header>

    <div class="chart-container">
      <div id="chart"></div>
      <div id="tooltip"></div>
    </div>

    <footer class="dashboard-footer">
      <span>Source: freeCodeCamp Global Temperature Dataset</span>
      <span>Built with D3.js</span>
    </footer>

  </main>

  <script src="https://cdn.freecodecamp.org/testable-projects-fcc/v1/bundle.js"></script>

</body>
</html>
